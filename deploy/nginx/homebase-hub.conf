# Homebase Hub on nginx with PHP-FPM (a VPS). nginx ignores the site's .htaccess files, so this file does their work:
# it keeps site-data, the engine's code and the docs closed, and sends the same security headers.
# tests/repo/deploy_test.py fails when a header here no longer matches the .htaccess files; tests/server/apache_test.py
# runs against nginx with this file in CI.
#
# Install: copy to /etc/nginx/sites-available/homebase-hub, link it into sites-enabled, change the three lines marked CHANGE,
# then: sudo nginx -t && sudo systemctl reload nginx. HTTPS: sudo certbot --nginx -d hub.example.com
# The site must be at the top of the domain (not in a sub-folder) with this file.

# ---- which headers each address gets (an empty value sends no header) ----
map $uri $hub_static {               # 1 for files nginx serves itself; PHP sends its own headers
    ~\.php$          0;
    default          1;
}
map $uri $hub_page_csp {
    ~^/web/tools/                    "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google.com https://*.gstatic.com; connect-src 'self' data: blob: https://www.google.com https://*.gstatic.com; worker-src 'self' blob:; media-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests";
    ~^/web/hub/media/                "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox";
    ~^/web/links/[^/]*\.html$        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
    ~^/web/files/index\.html$        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    ~^/web/files/share\.html$        "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src blob:; frame-src blob:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    ~^/web/(cards|info|settings|tasks)/[^/]*\.html$ "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    default                          "";
}
map $uri $hub_spec {                 # pre-load a page when you hover over its link in the bar
    ~^/web/tools/                                        '"../hub/core/assets/speculation-rules.json"';
    ~^/web/(links|cards|info|settings|tasks)/[^/]*\.html$ '"../hub/core/assets/speculation-rules.json"';
    ~^/web/files/index\.html$                            '"../hub/core/assets/speculation-rules.json"';
    default                                              "";
}
map $uri $hub_frame {
    ~^/web/links/    "DENY";
    default          "SAMEORIGIN";
}
map $uri $hub_referrer {
    ~^/web/tools/              "strict-origin-when-cross-origin";
    ~^/web/(settings|tasks)/   "no-referrer";
    default                    "same-origin";
}
map $uri $hub_permissions {
    ~^/web/tools/    "camera=(), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()";
    ~^/web/links/    "camera=(), microphone=(), geolocation=(), payment=()";
    default          "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
}
map "$uri|$arg_v" $hub_cache {
    ~^/web/tools/                                         "no-cache";
    ~\.html?\|                                            "no-cache";
    ~/logo-[a-z0-9]+\.(png|jpg|webp|gif|ico)\|            "public, max-age=31536000, immutable";
    "~\.(css|js|png|jpe?g|webp|svg|ico|woff2?)\|.+$"      "public, max-age=31536000, immutable";
    ~^/web/[a-z]+/assets/.*\.(css|js|png)\|$              "no-cache";
    ~^/web/hub/core/.*\.(css|js)\|$                       "no-cache";
    default                                               "";
}
map $https $hub_hsts {
    on       "max-age=31536000";
    default  "";
}
map $hub_static $hub_s_nosniff { 1 "nosniff"; default ""; }
map $hub_static $hub_s_robots  { 1 "noindex, nofollow"; default ""; }
map $hub_static $hub_s_coop    { 1 "same-origin"; default ""; }
map "$hub_static|$hub_frame" $hub_s_frame { ~^1\|(.+)$ $1; default ""; }
map "$hub_static|$hub_referrer" $hub_s_referrer { ~^1\|(.+)$ $1; default ""; }
map "$hub_static|$hub_permissions" $hub_s_permissions { ~^1\|(.+)$ $1; default ""; }
map "$hub_static|$hub_page_csp" $hub_s_csp { ~^1\|(.+)$ $1; default ""; }
map "$hub_static|$hub_hsts" $hub_s_hsts { ~^1\|(.+)$ $1; default ""; }

server {
    listen 80;
    listen [::]:80;
    server_name hub.example.com;            # CHANGE: your domain
    root /var/www/homebase-hub;             # CHANGE: the folder with index.php, web and site-data
    index index.php index.html;
    client_max_body_size 512m;
    server_tokens off;
    autoindex off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm application/octet-stream;

    include mime.types;
    types {
        application/javascript mjs;
        application/manifest+json webmanifest;
        application/octet-stream traineddata bcmap pfb onnx;
        font/ttf ttf;
    }

    add_header X-Content-Type-Options $hub_s_nosniff always;
    add_header X-Frame-Options $hub_s_frame always;
    add_header Referrer-Policy $hub_s_referrer always;
    add_header Cross-Origin-Opener-Policy $hub_s_coop always;
    add_header Permissions-Policy $hub_s_permissions always;
    add_header X-Robots-Tag $hub_s_robots always;
    add_header Strict-Transport-Security $hub_s_hsts always;
    add_header Content-Security-Policy $hub_s_csp always;
    add_header Speculation-Rules $hub_spec;
    add_header Cache-Control $hub_cache;

    # ---- never served ----
    location ^~ /site-data/         { return 404; }
    location ^~ /web/hub/docs/      { return 403; }
    location ^~ /web/hub/core/lib/  { return 403; }
    location ^~ /web/core-data/     { return 404; }
    location ~ /\.                  { return 403; }   # hidden files (.htaccess, .git)
    location ~ (^|/)(lib|config)\.php$ { return 403; }
    location ~ (\.(bak|old|orig|tmp|log|sql|zip|md|ini|inc|sh|lock|swp|dist|ya?ml)|~|/error_log(\.[0-9]+)?|/php_errorlog|/README\.txt)$ { return 403; }

    location = /web/hub/core/assets/speculation-rules.json {
        default_type application/speculationrules+json;
        types { }
    }
    location ~ ^/web/hub/core/.*\.json$ { return 403; }

    # your pictures: served as pictures only, nothing in here ever runs
    location ^~ /web/hub/media/ {
        location ~ (/\.|\.(php[0-9]?|phtml|phar|pl|py|cgi|sh|html?|js|mjs|json|md|txt|bak|old|orig|tmp|log|sql|zip|swp|ini|inc|lock)$|~$|/error_log) { return 403; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # CHANGE: your PHP version's socket (ls /run/php)
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
        # Only when another proxy (Cloudflare Tunnel, a load balancer) sits in front of this nginx: its address.
        # fastcgi_param HUB_TRUSTED_PROXY "10.0.0.5";
    }
}
