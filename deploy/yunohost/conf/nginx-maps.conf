# Made by scripts/make-yunohost.py from deploy/nginx/homebase-hub.conf: change that file, then run the script.
# At the http level: /etc/nginx/conf.d/homebasehub-maps.conf
# ---- which headers each address gets (an empty value sends no header) ----
map $uri $hub_static {               # 1 for files nginx serves itself; PHP sends its own headers
    ~\.php$          0;
    default          1;
}
map $uri $hub_page_csp {
    ~^/web/tools/                    "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google.com https://*.gstatic.com; connect-src 'self' data: blob: https://www.google.com https://*.gstatic.com; worker-src 'self' blob:; media-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests";
    ~^/web/hub/media/                "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox";
    ~^/web/links/[^/]*\.html$        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
    ~^/web/files/index\.html$        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    ~^/web/files/share\.html$        "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src blob:; frame-src blob:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    ~^/web/(cards|info|settings|tasks)/[^/]*\.html$ "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    default                          "";
}
map $uri $hub_spec {                 # pre-load a page when you hover over its link in the bar
    ~^/web/tools/                                        '"../hub/core/assets/speculation-rules.json"';
    ~^/web/(links|cards|info|settings|tasks)/[^/]*\.html$ '"../hub/core/assets/speculation-rules.json"';
    ~^/web/files/index\.html$                            '"../hub/core/assets/speculation-rules.json"';
    default                                              "";
}
map $uri $hub_frame {
    ~^/web/links/    "DENY";
    default          "SAMEORIGIN";
}
map $uri $hub_referrer {
    ~^/web/tools/              "strict-origin-when-cross-origin";
    ~^/web/(settings|tasks)/   "no-referrer";
    default                    "same-origin";
}
map $uri $hub_permissions {
    ~^/web/tools/    "camera=(), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()";
    ~^/web/links/    "camera=(), microphone=(), geolocation=(), payment=()";
    default          "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
}
map "$uri|$arg_v" $hub_cache {
    ~^/web/tools/                                         "no-cache";
    ~\.html?\|                                            "no-cache";
    ~/logo-[a-z0-9]+\.(png|jpg|webp|gif|ico)\|            "public, max-age=31536000, immutable";
    "~\.(css|js|png|jpe?g|webp|svg|ico|woff2?)\|.+$"      "public, max-age=31536000, immutable";
    ~^/web/[a-z]+/assets/.*\.(css|js|png)\|$              "no-cache";
    ~^/web/hub/core/.*\.(css|js)\|$                       "no-cache";
    default                                               "";
}
map $https $hub_hsts {
    on       "max-age=31536000";
    default  "";
}
map $hub_static $hub_s_nosniff { 1 "nosniff"; default ""; }
map $hub_static $hub_s_robots  { 1 "noindex, nofollow"; default ""; }
map $hub_static $hub_s_coop    { 1 "same-origin"; default ""; }
map "$hub_static|$hub_frame" $hub_s_frame { ~^1\|(.+)$ $1; default ""; }
map "$hub_static|$hub_referrer" $hub_s_referrer { ~^1\|(.+)$ $1; default ""; }
map "$hub_static|$hub_permissions" $hub_s_permissions { ~^1\|(.+)$ $1; default ""; }
map "$hub_static|$hub_page_csp" $hub_s_csp { ~^1\|(.+)$ $1; default ""; }
map "$hub_static|$hub_hsts" $hub_s_hsts { ~^1\|(.+)$ $1; default ""; }

# YunoHost: for PHP's answers, the header PHP sent (YunoHost's own server block would replace it otherwise)
map $hub_static $hub_y_nosniff { 1 $hub_s_nosniff; default $upstream_http_x_content_type_options; }
map $hub_static $hub_y_frame { 1 $hub_s_frame; default $upstream_http_x_frame_options; }
map $hub_static $hub_y_referrer { 1 $hub_s_referrer; default $upstream_http_referrer_policy; }
map $hub_static $hub_y_coop { 1 $hub_s_coop; default $upstream_http_cross_origin_opener_policy; }
map $hub_static $hub_y_permissions { 1 $hub_s_permissions; default $upstream_http_permissions_policy; }
map $hub_static $hub_y_robots { 1 $hub_s_robots; default $upstream_http_x_robots_tag; }
map $hub_static $hub_y_csp { 1 $hub_s_csp; default $upstream_http_content_security_policy; }
