# Homebase Hub with HTTPS from Caddy (it gets and renews the certificate by itself).
# Point your domain at this server, open ports 80 and 443, then:
#   HUB_DOMAIN=hub.example.com docker compose -f compose.caddy.yaml up -d
# and open https://hub.example.com. Keep the Caddyfile next to this file.
services:
  hub:
    image: ${HUB_IMAGE:-ghcr.io/jackpison/homebase-hub:latest}
    restart: unless-stopped
    volumes:
      - hub-site:/var/www/html
    environment:
      # Caddy's own fixed address (below): the site believes only Caddy about each visitor's address and HTTPS
      HUB_TRUSTED_PROXY: "172.30.77.10"
    networks:
      - hub
  caddy:
    image: caddy:2.11.6@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      HUB_DOMAIN: "${HUB_DOMAIN:?Set HUB_DOMAIN to your domain, for example HUB_DOMAIN=hub.example.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      hub:
        ipv4_address: 172.30.77.10
networks:
  hub:
    ipam:
      config:
        - subnet: 172.30.77.0/24
volumes:
  hub-site:
  caddy-data:
  caddy-config:
