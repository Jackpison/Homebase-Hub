# Homebase Hub on Apache (a VPS). The site's own .htaccess files do the protecting, so they must be read: AllowOverride All.
# Install:
#   sudo apt install apache2 libapache2-mod-php php-curl php-gd php-intl php-mbstring php-zip unzip
#   sudo a2enmod headers rewrite mime deflate
#   copy this file to /etc/apache2/sites-available/homebase-hub.conf, change the lines marked CHANGE, then
#   sudo a2ensite homebase-hub && sudo apache2ctl configtest && sudo systemctl reload apache2
#   HTTPS: sudo apt install certbot python3-certbot-apache && sudo certbot --apache -d hub.example.com
<VirtualHost *:80>
  # CHANGE: your domain
  ServerName hub.example.com
  # CHANGE (here and in Directory): the folder with index.php, web and site-data
  DocumentRoot /var/www/homebase-hub
  <Directory /var/www/homebase-hub>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>
  # Only when another proxy (Cloudflare Tunnel, a load balancer) sits in front of this Apache: its address.
  # SetEnv HUB_TRUSTED_PROXY "10.0.0.5"
  ErrorLog ${APACHE_LOG_DIR}/homebase-hub-error.log
  CustomLog ${APACHE_LOG_DIR}/homebase-hub-access.log combined
</VirtualHost>
