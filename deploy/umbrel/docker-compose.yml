# Homebase Hub for umbrelOS (see umbrel-app.yml). Umbrel's app_proxy sits in front and adds HTTPS when Umbrel has it.
# The site keeps its own login, so Umbrel's login is not added in front of it.
version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: homebase-hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"
  web:
    image: ghcr.io/jackpison/homebase-hub:1.78.2
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/site:/var/www/html
