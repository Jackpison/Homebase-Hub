<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src blob:; frame-src blob:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>A Shared File</title>
<link rel="stylesheet" href="assets/share.css?v=1.81.0">
<link rel="stylesheet" href="assets/filecard.css?v=1.81.0">
</head>
<body>
<main class="card" id="app">
  <div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5"/></svg></div>
  <h1 id="name">Opening the File…</h1>
  <p id="info"></p>
  <form id="pwf" class="pwf" hidden><label for="pw">Password</label><input type="password" id="pw" autocomplete="off" required><button type="submit" class="btn pri">Open File</button></form>
  <div id="pv" class="pv" hidden></div>
  <p class="err" id="err" role="alert"></p>
  <div class="acts"><button type="button" id="dl" class="btn pri" hidden>Download</button></div>
  <p class="foot">This file was locked in the sender's browser. The key that opens it is in this link (after the #) and never reaches the server that stores it.</p>
</main>
<script src="assets/filecard.js?v=1.81.0"></script>
<script src="assets/share.js?v=1.81.0"></script>
</body>
</html>
