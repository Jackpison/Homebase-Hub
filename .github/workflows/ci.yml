name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: PHP lint
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Build
        run: npm i --no-save esbuild && python3 tools/build.py
      - name: Check zip name and changelog
        run: |
          ls build/site-update-*.zip
          unzip -l build/site-update-*.zip | grep -q 'web/core-data/docs/CHANGELOG.md'
          ! ls build/site-update-*.zip | grep -q '_'
