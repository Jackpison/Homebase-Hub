name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A branch with an open pull request used to run twice per push (once as a push, once as the pull request), and an older run kept going after a newer push.
# Now it runs once, and a newer push cancels the older run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    # Lists what this push or pull request changed. On a docs-only change (scripts/ci_changes.py says which files count)
    # the slow jobs below skip themselves; any doubt (a new branch, a manual run, no base) runs everything.
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci_changes.py >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    timeout-minutes: 15
    name: build (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: '${{ matrix.php }}' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.php == '8.3'
        with: { node-version: '24', cache: npm }
      - name: PHP lint
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests (Telegram snooze, /add, dates, update names, backup encryption)
        run: php tests/unit/run.php
      - name: PHPStan (static analysis)
        if: matrix.php == '8.3'
        run: |
          curl -fsSL -o phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.1.33/phpstan.phar
          echo "48caad125554d6b416159db71dd7fd890295ba1a24b3650b49e32752e24fd6a0  phpstan.phar" | sha256sum -c -
          php -d memory_limit=1G phpstan.phar analyse -c tests/repo/phpstan.neon --no-progress
      - name: Library safety check
        if: matrix.php == '8.3'   # the same answer on any PHP: 8.4 and 8.5 run only lint and the unit tests
        run: python3 tests/repo/check_libraries.py
      - name: Workflow files keep their safety settings (pinned Actions, no kept token, time limits) and no secret is in the repo
        if: matrix.php == '8.3'
        run: python3 tests/repo/workflows_test.py && python3 tests/repo/secrets_test.py && python3 tests/repo/ci_status_test.py && python3 tests/repo/ci_changes_test.py && python3 tests/repo/releases_test.py && python3 tests/repo/maintain_test.py && python3 tests/repo/presets_test.py && python3 tests/repo/tools_list_test.py
      - name: Workflow check (zizmor, strictest setting)
        if: matrix.php == '8.3'
        run: python3 -m venv /tmp/zz && /tmp/zz/bin/pip install -q zizmor==1.30.1 && /tmp/zz/bin/zizmor --offline --persona=auditor .github/workflows/
      - name: Version agrees everywhere (scripts/release.py --check) and its own test
        if: matrix.php == '8.3'
        run: python3 scripts/release.py --check && python3 tests/repo/release_test.py
      - name: Build
        if: matrix.php == '8.3'
        run: npm ci --ignore-scripts && python3 scripts/build.py
      - name: Tools is exactly what tools-app builds (no stale library in the committed files)
        if: matrix.php == '8.3'
        run: python3 scripts/build-tools.py --check
      - name: ESLint (undefined names, redeclarations, duplicate keys, unreachable code)
        if: matrix.php == '8.3'
        run: npx eslint src tools-app
      - name: TypeScript check (the files that start with ts-check - keys, locked data, share links)
        if: matrix.php == '8.3'
        run: npx tsc -p tsconfig.json && python3 tests/repo/tscheck_test.py
      - name: Check zip name and changelog
        if: matrix.php == '8.3'
        run: |
          ls build/site-update-*.zip
          unzip -l build/site-update-*.zip | grep -q 'web/hub/docs/CHANGELOG.md'
          ! ls build/site-update-*.zip | grep -q '_'

  server:
    needs: changes
    if: needs.changes.outputs.code == 'true'   # skipped on a docs-only change
    # Updates, hostile zips and the core features: PHP and Python only, no browser to install. Runs beside the browser jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: server (updates, hostile zips, core)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: '8.3', extensions: 'curl, zip, mbstring' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: tests/requirements.txt }
      - name: Tools for the tests
        run: |
          npm ci --ignore-scripts
          pip install -r tests/requirements.txt
      - name: Build the zip
        run: python3 scripts/build.py
      - name: Get the previous and an older release (checked against their SHA-256)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PREV=$(python3 tests/lib/releases.py previous)
          echo "previous release: $PREV"
          python3 tests/lib/releases.py download "$PREV" rel-prev
          python3 tests/lib/releases.py download v1.37.0 rel-old
      - name: Update tests
        if: success() || failure()
        run: |
          set -o pipefail
          python3 tests/server/update_test.py build/site-update-*.zip rel-prev/site-update-*.zip rel-old/site-update-*.zip 2>&1 | python3 tests/lib/annotate.py "updates"
      - name: Hostile update zips
        if: success() || failure()
        run: |
          set -o pipefail
          python3 tests/server/update_attack_test.py build/site-update-*.zip 2>&1 | python3 tests/lib/annotate.py "hostile zips"
      - name: Core features (backup, two-step login, Start Over, lockout, security token)
        if: success() || failure()
        run: |
          set -o pipefail
          python3 tests/server/core_test.py build/site-update-*.zip 2>&1 | python3 tests/lib/annotate.py "core"

      - name: Files, server side (locked names, limit, Trash, share links)
        if: success() || failure()
        run: |
          set -o pipefail
          python3 tests/server/files_test.py build/site-update-*.zip 2>&1 | python3 tests/lib/annotate.py "files server"

  browsers:
    needs: changes
    if: needs.changes.outputs.code == 'true'   # skipped on a docs-only change
    # Every page in a real browser, three jobs side by side: Chromium in two halves (pages, tools) and WebKit whole (every iPhone browser uses it).
    # Firefox runs on the 1st and 15th in firefox-check.yml. Each job installs the browser's Ubuntu packages itself, so a stuck
    # download holds one job, not all: the install below tries three times.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, part: pages }
          - { browser: chromium, part: tools }
          - { browser: webkit, part: all }
    timeout-minutes: 25
    name: browser (${{ matrix.browser }}, ${{ matrix.part }})
    env:
      BROWSER: ${{ matrix.browser }}   # the scripts read it from here, never pasted into the script text
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: '8.3', extensions: 'curl, zip, mbstring' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: tests/requirements.txt }
      - name: Keep the downloaded browser between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}
      - name: npm packages
        run: npm ci --ignore-scripts
      - name: Python packages
        run: pip install -r tests/requirements.txt
      - name: Browser system packages from Ubuntu (up to 3 tries of 2 minutes; a good install takes under a minute, a stuck one used to hold a job for 20)
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            sudo timeout -k 15 120 "$(command -v python)" -m playwright install-deps "$BROWSER" && exit 0
            echo "::warning::try $i to install the browser's system packages failed or took over 2 minutes"
            sudo killall -q apt-get dpkg || true; sleep 10
          done
          exit 1
      - name: The browser
        timeout-minutes: 10
        run: python -m playwright install "$BROWSER"
      - name: Build the zip (and the website for the tools half and WebKit)
        id: build
        env:
          PART: ${{ matrix.part }}
        run: |
          python3 scripts/build.py
          if [ "$PART" != pages ]; then python3 scripts/make-site.py --no-guide; fi
      # ---- half 1: the pages, the bar, Settings, accessibility (about 275 s) ----
      - name: Install on a phone (manifest, icons, head tags, Settings card, Chromium installability)
        if: matrix.browser == 'chromium' && matrix.part == 'pages' && (success() || failure()) && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 tests/browser/app_test.py build/site-update-*.zip 2>&1 | python3 tests/lib/annotate.py "app"
      - name: Settings and Home (Telegram backup button, GitHub link, upload limit, config.json clean-up)
        if: matrix.browser == 'chromium' && matrix.part == 'pages' && (success() || failure()) && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 tests/browser/settings_test.py build/site-update-*.zip 2>&1 | python3 tests/lib/annotate.py "settings"
      - name: Import Bookmarks
        if: matrix.part != 'tools' && (success() || failure()) && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 tests/browser/import_test.py build/site-update-*.zip --browser "$BROWSER" 2>&1 | python3 tests/lib/annotate.py "import"
      - name: Pages
        if: matrix.part != 'tools' && (success() || failure()) && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 tests/browser/pages_test.py build/site-update-*.zip --browser "$BROWSER" 2>&1 | python3 tests/lib/annotate.py "pages"
      - name: The bar in all three styles (computer and phone)
        if: matrix.part != 'tools' && (success() || failure()) && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 tests/browser/nav_test.py build/site-update-*.zip --browser "$BROWSER" 2>&1 | python3 tests/lib/annotate.py "nav"
      - name: Settings windows, Only Me, Backup tabs, Export Bookmarks, calendar link, keyboard shortcuts
        if: matrix.part != 'tools' && (success() || failure()) && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 tests/browser/settings_ui_test.py build/site-update-*.zip --browser "$BROWSER" 2>&1 | python3 tests/lib/annotate.py "settings ui"
      - name: Accessibility
        if: matrix.part == 'pages' && (success() || failure()) && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 tests/browser/a11y_test.py build/site-update-*.zip --browser "$BROWSER" 2>&1 | python3 tests/lib/annotate.py "a11y"
      # ---- half 2: Tools, encryption and Files, the look and phone width, passkeys, a slow phone, the website (about 240 s) ----
      - name: Tools
        if: matrix.part != 'pages' && (success() || failure()) && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 tests/browser/tools_test.py build/site-update-*.zip --browser "$BROWSER" 2>&1 | python3 tests/lib/annotate.py "tools"
      - name: Encryption, Files, locked Cards, Tools presets and private tabs
        if: matrix.part != 'pages' && (success() || failure()) && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          for t in encrypt files lock tabs_lock; do
            python3 tests/browser/${t}_test.py build/site-update-*.zip --browser "$BROWSER" 2>&1 | python3 tests/lib/annotate.py "$t"
          done
      - name: The look of Settings and Files (cards, Save bar, grid previews, nothing wider than a phone)
        if: matrix.part != 'pages' && (success() || failure()) && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 tests/browser/settings_look_test.py build/site-update-*.zip --browser "$BROWSER" 2>&1 | python3 tests/lib/annotate.py "settings look"
      - name: Passkeys and Share from the phone (Chromium only, its virtual authenticator and service workers)
        if: matrix.browser == 'chromium' && matrix.part == 'tools' && (success() || failure()) && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 tests/browser/passkey_test.py build/site-update-*.zip 2>&1 | python3 tests/lib/annotate.py "passkeys"
          python3 tests/browser/share_test.py build/site-update-*.zip 2>&1 | python3 tests/lib/annotate.py "share"
      - name: A slow phone (every page, slowed processor and network)
        if: matrix.browser == 'chromium' && matrix.part == 'tools' && (success() || failure()) && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 tests/browser/speed_test.py build/site-update-*.zip 2>&1 | python3 tests/lib/annotate.py "slow phone"
      - name: Website (links, security policy, interactions, phone layout, accessibility in dark and light)
        if: matrix.part != 'pages' && (success() || failure()) && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 tests/browser/website_test.py build/site --browser "$BROWSER" 2>&1 | python3 tests/lib/annotate.py "website"

  apache:
    needs: changes
    if: needs.changes.outputs.code == 'true'   # skipped on a docs-only change
    # Installing Apache takes about five minutes on a fresh runner, so it runs beside the other tests instead of after them.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: apache (the .htaccess files)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: '8.3', extensions: 'curl, zip, mbstring' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: tests/requirements.txt }
      - name: npm packages
        run: npm ci --ignore-scripts
      - name: Python packages
        run: pip install -r tests/requirements.txt
      - name: Browser system packages from Ubuntu (up to 3 tries of 2 minutes; a good install takes under a minute, a stuck one used to hold a job for 20)
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            sudo timeout -k 15 120 "$(command -v python)" -m playwright install-deps chromium && exit 0
            echo "::warning::try $i to install the browser's system packages failed or took over 2 minutes"
            sudo killall -q apt-get dpkg || true; sleep 10
          done
          exit 1
      - name: The browser
        timeout-minutes: 10
        run: python -m playwright install chromium
      - name: Build the zip
        run: python3 scripts/build.py
      - name: On real Apache (the .htaccess files)
        run: |
          sudo sh tests/server/apache_setup.sh build/site-update-*.zip
          python3 tests/server/apache_test.py

  ci-ok:
    # The one check that sums up CI: it fails when any job failed or was cancelled, and passes when every job passed
    # or was skipped (a docs-only change). The check to require on main if required checks are ever turned on.
    name: ci-ok
    needs: [changes, build, server, browsers, apache]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A job ended as: $r"; exit 1 ;; esac
          done
