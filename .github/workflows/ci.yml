name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A branch with an open pull request used to run twice per push (once as a push, once as the pull request), and an older run kept going after a newer push.
# Now it runs once, and a newer push cancels the older run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    # Lists what this push or pull request changed. On a docs-only change (scripts/ci_changes.py says which files count)
    # the slow jobs below skip themselves; any doubt (a new branch, a manual run, no base) runs everything.
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci_changes.py >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # one job: the checks on PHP 8.3, then (last) the lint and unit tests on every supported PHP, worked out each time by tests/repo/php_matrix.py
    name: build (every supported PHP)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 50 }   # the secret check also reads the last 50 commit messages
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: '8.3' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm }
      - name: PHP 8.3 - lint
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: PHP 8.3 - unit tests (Telegram snooze, /add, dates, update names, backup encryption)
        run: php tests/unit/run.php
      - name: PHPStan (static analysis)
        run: |
          curl -fsSL -o phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.1.33/phpstan.phar
          echo "48caad125554d6b416159db71dd7fd890295ba1a24b3650b49e32752e24fd6a0  phpstan.phar" | sha256sum -c -
          php -d memory_limit=1G phpstan.phar analyse -c tests/repo/phpstan.neon --no-progress
      - name: Library safety check
        run: python3 tests/repo/check_libraries.py
      - name: Workflow files keep their safety settings (pinned Actions, no kept token, time limits) and no secret is in the repo
        run: python3 tests/repo/workflows_test.py && python3 tests/repo/secrets_test.py && python3 tests/repo/parallel_test.py && python3 tests/repo/ci_status_test.py && python3 tests/repo/ci_changes_test.py && python3 tests/repo/releases_test.py && python3 tests/repo/maintain_test.py && python3 tests/repo/presets_test.py && python3 tests/repo/tools_list_test.py && python3 tests/repo/root_test.py && python3 tests/repo/speculation_test.py
      - name: Workflow check (zizmor, strictest setting)
        run: python3 -m venv /tmp/zz && /tmp/zz/bin/pip install -q zizmor==1.30.1 && /tmp/zz/bin/zizmor --offline --persona=auditor .github/workflows/
      - name: Workflow check (actionlint, with shellcheck on the shell steps; the download is checked against its SHA-256)
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: Python lint (ruff, for syntax errors and unused or undefined names in tests and scripts)
        run: python3 -m venv /tmp/rf && /tmp/rf/bin/pip install -q ruff==0.14.0 && /tmp/rf/bin/ruff check
      - name: Dead code (a PHP function, constant, JavaScript function or CSS class that nothing uses)
        run: python3 tests/repo/dead_code_test.py
      - name: Version agrees everywhere (scripts/release.py --check) and its own test
        run: python3 scripts/release.py --check && python3 tests/repo/release_test.py
      - name: Build
        run: npm ci --ignore-scripts && python3 scripts/build.py
      - name: Tools is exactly what tools-app builds (no stale library in the committed files)
        run: python3 scripts/build-tools.py --check
      - name: ESLint (undefined names, redeclarations, duplicate keys, unreachable code)
        run: npx eslint src tools-app
      - name: TypeScript check (the files that start with ts-check - keys, locked data, share links)
        run: npx tsc -p config/tsconfig.json && npx tsc -p config/tsconfig.links.json && npx tsc -p config/tsconfig.home.json && npx tsc -p config/tsconfig.cards.json && npx tsc -p config/tsconfig.tasks.json && npx tsc -p config/tsconfig.info.json && python3 tests/repo/tscheck_test.py
      - name: Check zip name and changelog
        run: |
          set -- build/site-update-*.zip
          echo "$@"
          unzip -l "$1" | grep -q 'web/hub/docs/CHANGELOG.md'
          case "$1" in *_*) echo "the zip's name has an underscore"; exit 1 ;; esac
      - name: Every supported PHP (the range is worked out, so a new PHP is added by itself; the next one is only a warning)
        run: python3 tests/repo/php_matrix.py --install

  server:
    needs: changes
    if: needs.changes.outputs.code == 'true'   # skipped on a docs-only change
    # Updates, hostile zips and the core features: PHP and Python only, no browser to install. Runs beside the browser jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: server (updates, hostile zips, core)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: '8.3', extensions: 'curl, zip, mbstring' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: tests/requirements.txt }
      - name: Tools for the tests
        run: |
          npm ci --ignore-scripts
          pip install -r tests/requirements.txt
      - name: Build the zip
        run: python3 scripts/build.py
      - name: Get the previous and an older release (checked against their SHA-256)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PREV=$(python3 tests/lib/releases.py previous)
          echo "previous release: $PREV"
          python3 tests/lib/releases.py download "$PREV" rel-prev
          python3 tests/lib/releases.py download v1.37.0 rel-old
      - name: Update tests
        if: success() || failure()
        run: |
          set -o pipefail
          python3 tests/server/update_test.py build/site-update-*.zip rel-prev/site-update-*.zip rel-old/site-update-*.zip 2>&1 | python3 tests/lib/annotate.py "updates"
      - name: Hostile update zips
        if: success() || failure()
        run: |
          set -o pipefail
          python3 tests/server/update_attack_test.py build/site-update-*.zip 2>&1 | python3 tests/lib/annotate.py "hostile zips"
      - name: Core features (backup, two-step login, Start Over, lockout, security token)
        if: success() || failure()
        run: |
          set -o pipefail
          python3 tests/server/core_test.py build/site-update-*.zip 2>&1 | python3 tests/lib/annotate.py "core"

      - name: Files, server side (locked names, limit, Trash, share links)
        if: success() || failure()
        run: |
          set -o pipefail
          python3 tests/server/files_test.py build/site-update-*.zip 2>&1 | python3 tests/lib/annotate.py "files server"

  browsers:
    needs: changes
    if: needs.changes.outputs.code == 'true'   # skipped on a docs-only change
    # Every page in a real browser: Chromium and WebKit (every iPhone browser uses it), each in two halves (pages, tools), four jobs side by side.
    # Inside a half several tests run at the same time (tests/lib/run_parallel.py): each test has its own port and /tmp folder.
    # Chromium runs three at once, WebKit two: with three, WebKit cancelled requests and missed timings on a busy runner (1.61.10).
    # Only the slow-phone test runs alone, because it measures time. Firefox runs on the 1st and 15th in firefox-check.yml.
    # Each job installs the browser's Ubuntu packages itself, so a stuck download holds one job, not all: the install tries three times.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        part: [pages, tools]
    timeout-minutes: 25
    name: browser (${{ matrix.browser }}, ${{ matrix.part }})
    env:
      BROWSER: ${{ matrix.browser }}   # the scripts read it from here, never pasted into the script text
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: '8.3', extensions: 'curl, zip, mbstring' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: tests/requirements.txt }
      - name: Keep the downloaded browser between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}
      - name: npm packages
        run: npm ci --ignore-scripts
      - name: Python packages
        run: pip install -r tests/requirements.txt
      - name: Build the zip while the browser's Ubuntu packages install (up to 3 tries of 2 minutes; a stuck install used to hold a job for 20)
        id: build
        timeout-minutes: 8
        env:
          PART: ${{ matrix.part }}
        run: |
          # the zip (and for the tools half the website) is built in the background while apt works
          ( python3 scripts/build.py && if [ "$PART" = tools ]; then python3 scripts/make-site.py --no-guide; fi ) > build.log 2>&1 &
          BUILD=$!
          ok=0
          for i in 1 2 3; do
            if sudo timeout -k 15 120 "$(command -v python)" -m playwright install-deps "$BROWSER"; then ok=1; break; fi
            echo "::warning::try $i to install the browser's system packages failed or took over 2 minutes"
            sudo killall -q apt-get dpkg || true; sleep 10
          done
          if wait "$BUILD"; then built=1; else built=0; fi
          cat build.log
          [ "$ok" = 1 ] && [ "$built" = 1 ]
      - name: The browser
        timeout-minutes: 10
        run: python -m playwright install "$BROWSER"
      - name: Pages half in Chromium (several tests at once)
        if: matrix.browser == 'chromium' && matrix.part == 'pages' && steps.build.outcome == 'success'
        run: |
          python3 tests/lib/run_parallel.py -j 3 \
            "pages|tests/browser/pages_test.py build/site-update-*.zip --browser chromium" \
            "accessibility|tests/browser/a11y_test.py build/site-update-*.zip --browser chromium" \
            "nav|tests/browser/nav_test.py build/site-update-*.zip --browser chromium" \
            "settings ui|tests/browser/settings_ui_test.py build/site-update-*.zip --browser chromium" \
            "import|tests/browser/import_test.py build/site-update-*.zip --browser chromium" \
            "app|tests/browser/app_test.py build/site-update-*.zip" \
            "settings|tests/browser/settings_test.py build/site-update-*.zip"
      - name: Pages half in WebKit (several tests at once)
        if: matrix.browser == 'webkit' && matrix.part == 'pages' && steps.build.outcome == 'success'
        run: |
          python3 tests/lib/run_parallel.py -j 2 \
            "pages webkit|tests/browser/pages_test.py build/site-update-*.zip --browser webkit" \
            "nav webkit|tests/browser/nav_test.py build/site-update-*.zip --browser webkit" \
            "settings ui webkit|tests/browser/settings_ui_test.py build/site-update-*.zip --browser webkit" \
            "import webkit|tests/browser/import_test.py build/site-update-*.zip --browser webkit"
      - name: Tools half in Chromium (several tests at once, then the slow-phone test alone)
        if: matrix.browser == 'chromium' && matrix.part == 'tools' && steps.build.outcome == 'success'
        run: |
          rc=0
          python3 tests/lib/run_parallel.py -j 3 \
            "tools|tests/browser/tools_test.py build/site-update-*.zip --browser chromium" \
            "website|tests/browser/website_test.py build/site --browser chromium" \
            "encrypt|tests/browser/encrypt_test.py build/site-update-*.zip --browser chromium" \
            "files|tests/browser/files_test.py build/site-update-*.zip --browser chromium" \
            "lock|tests/browser/lock_test.py build/site-update-*.zip --browser chromium" \
            "tabs lock|tests/browser/tabs_lock_test.py build/site-update-*.zip --browser chromium" \
            "tabs kit|tests/browser/tabs_kit_test.py build/site-update-*.zip --browser chromium" \
            "settings look|tests/browser/settings_look_test.py build/site-update-*.zip --browser chromium" \
            "windows|tests/browser/windows_test.py build/site-update-*.zip --browser chromium" \
            "passkeys|tests/browser/passkey_test.py build/site-update-*.zip" \
            "share|tests/browser/share_test.py build/site-update-*.zip" || rc=1
          python3 tests/lib/run_parallel.py -j 1 "slow phone|tests/browser/speed_test.py build/site-update-*.zip" || rc=1
          exit $rc
      - name: Tools half in WebKit (several tests at once)
        if: matrix.browser == 'webkit' && matrix.part == 'tools' && steps.build.outcome == 'success'
        run: |
          python3 tests/lib/run_parallel.py -j 2 \
            "tools webkit|tests/browser/tools_test.py build/site-update-*.zip --browser webkit" \
            "website webkit|tests/browser/website_test.py build/site --browser webkit" \
            "encrypt webkit|tests/browser/encrypt_test.py build/site-update-*.zip --browser webkit" \
            "files webkit|tests/browser/files_test.py build/site-update-*.zip --browser webkit" \
            "lock webkit|tests/browser/lock_test.py build/site-update-*.zip --browser webkit" \
            "tabs lock webkit|tests/browser/tabs_lock_test.py build/site-update-*.zip --browser webkit" \
            "tabs kit webkit|tests/browser/tabs_kit_test.py build/site-update-*.zip --browser webkit" \
            "settings look webkit|tests/browser/settings_look_test.py build/site-update-*.zip --browser webkit" \
            "windows webkit|tests/browser/windows_test.py build/site-update-*.zip --browser webkit"

  apache:
    needs: changes
    if: needs.changes.outputs.code == 'true'   # skipped on a docs-only change
    # Installing Apache takes about five minutes on a fresh runner, so it runs beside the other tests instead of after them.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: apache (the .htaccess files)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: '8.3', extensions: 'curl, zip, mbstring' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: tests/requirements.txt }
      - name: npm packages
        run: npm ci --ignore-scripts
      - name: Python packages
        run: pip install -r tests/requirements.txt
      - name: Browser system packages from Ubuntu (up to 3 tries of 2 minutes; a good install takes under a minute, a stuck one used to hold a job for 20)
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            sudo timeout -k 15 120 "$(command -v python)" -m playwright install-deps chromium && exit 0
            echo "::warning::try $i to install the browser's system packages failed or took over 2 minutes"
            sudo killall -q apt-get dpkg || true; sleep 10
          done
          exit 1
      - name: The browser
        timeout-minutes: 10
        run: python -m playwright install chromium
      - name: Build the zip
        run: python3 scripts/build.py
      - name: On real Apache (the .htaccess files)
        run: |
          sudo sh tests/server/apache_setup.sh build/site-update-*.zip
          python3 tests/server/apache_test.py

  ci-ok:
    # The one check that sums up CI: it fails when any job failed or was cancelled, and passes when every job passed
    # or was skipped (a docs-only change). The check to require on main if required checks are ever turned on.
    name: ci-ok
    needs: [changes, build, server, browsers, apache]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A job ended as: $r"; exit 1 ;; esac
          done
