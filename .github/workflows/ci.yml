name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    name: build (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: PHP lint
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Library safety check
        run: python3 tests/check_libraries.py
      - name: Build
        run: npm i --no-save esbuild && python3 tools/build.py
      - name: Check zip name and changelog
        run: |
          ls build/site-update-*.zip
          unzip -l build/site-update-*.zip | grep -q 'web/docs/CHANGELOG.md'
          ! ls build/site-update-*.zip | grep -q '_'
