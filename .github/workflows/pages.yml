name: Pages
on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/make-*.py', 'scripts/site_pages.py', 'tools-app/src/tools.json', 'CHANGELOG.md', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    name: deploy (website, guides, latest.json)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read   # check out the repo and read the releases
      pages: write     # publish the website
      id-token: write  # prove to GitHub Pages that this workflow is the one deploying
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - run: pip install reportlab pillow
      - name: Find the newest release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          {
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            V=${TAG#v}
            gh release download "$TAG" -p "site-update-$V.zip.sha256" -D /tmp/rel
            gh release download "$TAG" -p "site-update-$V.zip" -D /tmp/rel
            {
              echo "sha=$(cut -d' ' -f1 "/tmp/rel/site-update-$V.zip.sha256")"
              echo "size=$(stat -c%s "/tmp/rel/site-update-$V.zip")"
            } >> "$GITHUB_OUTPUT"
            echo "ver=$V" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the website
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          VER: ${{ steps.rel.outputs.ver }}
          SHA: ${{ steps.rel.outputs.sha }}
          SIZE: ${{ steps.rel.outputs.size }}
        run: |
          if [ -n "$TAG" ]; then
            python3 scripts/make-site.py --latest Jackpison Homebase-Hub "$VER" "$SHA" "$SIZE"
          else
            python3 scripts/make-site.py
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: build/site }
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
