name: Code scanning
# CodeQL and Semgrep look for classic security mistakes (injection, unsafe file names, unsafe HTML, weak randomness) in the site's
# JavaScript and PHP on every push to main, every pull request, and once a week (new rules appear over time).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  codeql:
    # (2026-11) three languages side by side: the site's JavaScript, the Python of the build scripts and tests, and the workflow files
    # themselves ("actions": untrusted input reaching a shell, a token with too much reach)
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    permissions:
      contents: read
      security-events: write   # to show what it found under Security > Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with: { category: '/language:${{ matrix.language }}' }

  semgrep:
    name: Semgrep (PHP and JavaScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - name: Semgrep (a finding fails the run; metrics off)
        run: |
          python3 -m venv /tmp/sg
          /tmp/sg/bin/pip install -q semgrep==1.183.0
          # --timeout 60: the default (5 s a rule) gave up on shell-admin.js, so two rules never checked it (1.67.1)
          /tmp/sg/bin/semgrep scan --metrics=off --disable-version-check --error --timeout 60 --config p/php --config p/javascript \
            --exclude node_modules --exclude src/web/tools --exclude build --exclude website .
