name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    name: build and publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 40   # up to 20 minutes waiting for CI, then the build
    permissions:
      contents: write   # create the release and attach the zip
      actions: write    # start the Pages workflow afterwards
      checks: read      # read CI's results for the tagged commit
      id-token: write      # for the signed build note (attestation) of the zip
      attestations: write  # store that note with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Wait for CI on this commit; refuse unless every job passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci_status.py "$GITHUB_SHA" --wait 20
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', package-manager-cache: false }   # no download cache: the release builds from a clean npm ci --ignore-scripts
      - name: Version agrees everywhere (HUB, ?v=, changelog, Version Map, root copy, no TODO)
        run: python3 scripts/release.py --check
      - name: Build
        run: npm ci --ignore-scripts && python3 scripts/build.py
      - name: Signed build note for the zip (it proves this repository's workflow built it; a failure here never stops a release)
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/site-update-*.zip
      - name: Check the tag matches the version in the code
        run: |
          set -- build/site-update-*.zip
          V=${1##*site-update-}; V=${V%.zip}
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match HUB $V"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-notes.py "${GITHUB_REF_NAME}" > /tmp/notes.md
          # A release made on github.com's "Draft a new release" page already exists by now: fill it in instead of failing.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" build/site-update-*.zip build/site-update-*.zip.sha256 --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md
          else
            gh release create "${GITHUB_REF_NAME}" build/site-update-*.zip build/site-update-*.zip.sha256 \
              --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md
          fi
      - name: Publish latest.json and the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
