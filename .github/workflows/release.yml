name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', cache: npm }
      - name: Version agrees everywhere (HUB, ?v=, changelog, Version Map, root copy, no TODO)
        run: python3 scripts/release.py --check
      - name: Build
        run: npm ci && python3 scripts/build.py
      - name: Check the tag matches the version in the code
        run: |
          V=$(ls build/site-update-*.zip | sed -E 's/.*site-update-(.*)\.zip/\1/')
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match HUB $V"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-notes.py "${GITHUB_REF_NAME}" > /tmp/notes.md
          # A release made on github.com's "Draft a new release" page already exists by now: fill it in instead of failing.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" build/site-update-*.zip build/site-update-*.zip.sha256 --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md
          else
            gh release create "${GITHUB_REF_NAME}" build/site-update-*.zip build/site-update-*.zip.sha256 \
              --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md
          fi
      - name: Publish latest.json and the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
