name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build
        run: npm i --no-save esbuild && python3 tools/build.py
      - name: Check tag matches version
        run: |
          V=$(ls build/site-update-*.zip | sed -E 's/.*site-update-(.*)\.zip/\1/')
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match HUB $V"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/site-update-*.zip build/site-update-*.zip.sha256 \
            --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
