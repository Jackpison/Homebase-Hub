name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    name: build and publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 40   # up to 20 minutes waiting for CI, then the build
    permissions:
      contents: write   # create the release and attach the zip
      actions: write    # start the Pages workflow afterwards
      checks: read      # read CI's results for the tagged commit
      id-token: write      # for the signed build note (attestation) of the zip
      attestations: write  # store that note with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Check the tag matches the version in the code (first, before waiting for CI or building)
        run: |
          V=$(sed -n "s/^define('HUB', '\([^']*\)').*/\1/p" src/web/hub/core/lib/boot.php)
          if [ -z "$V" ] || [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "::error title=Tag and version differ::The tag ${GITHUB_REF_NAME} does not match the version in the code (${V:-unknown}). Nothing was published. If a Monthly maintenance pull request is open, merge it first. Then delete this release and its tag on github.com and publish again with the tag v${V} or the merged version. See docs/MAINTAINING.md."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} = HUB ${V}"
      - name: Wait for CI on this commit; refuse unless every job passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci_status.py "$GITHUB_SHA" --wait 20
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24', package-manager-cache: false }   # no download cache: the release builds from a clean npm ci --ignore-scripts
      - name: Version agrees everywhere (HUB, ?v=, changelog, Version Map, root copy, no TODO)
        run: python3 scripts/release.py --check
      - name: Build
        run: npm ci --ignore-scripts && python3 scripts/build.py
      - name: The zip carries the same version
        run: |
          set -- build/site-update-*.zip
          V=${1##*site-update-}; V=${V%.zip}
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "::error::The built zip is version $V, not ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: Signed build note for the zip (it proves this repository's workflow built it; a failure here never stops a release)
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/site-update-*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-notes.py "${GITHUB_REF_NAME}" > /tmp/notes.md
          # A release made on github.com's "Draft a new release" page already exists by now: fill it in instead of failing.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" build/site-update-*.zip build/site-update-*.zip.sha256 --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md
          else
            gh release create "${GITHUB_REF_NAME}" build/site-update-*.zip build/site-update-*.zip.sha256 \
              --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md
          fi
      - name: Publish latest.json and the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

  docker:
    # After the release: the Docker image (deploy/docker) with exactly the released zip inside, for PCs and servers (amd64)
    # and Raspberry Pi and other ARM boards (arm64). Each is built on its own kind of machine (no emulation, a few minutes)
    # and pushed without a tag; docker-tags then joins them under X.Y.Z, X.Y and latest at ghcr.io/<owner>/homebase-hub.
    # The release itself is already published when this runs, so a failure here never holds it back.
    name: "build the Docker image (${{ matrix.arch }})"
    needs: release
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read       # read the release's zip
      packages: write      # push the image to GitHub's registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: The released zip, checked against its published SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${GITHUB_REF_NAME#v}; mkdir -p /tmp/rel
          gh release download "${GITHUB_REF_NAME}" -p "site-update-$V.zip" -p "site-update-$V.zip.sha256" -D /tmp/rel
          (cd /tmp/rel && sha256sum -c "site-update-$V.zip.sha256")
          cp "/tmp/rel/site-update-$V.zip" deploy/docker/site.zip
      - name: Image name
        id: img
        run: echo "img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homebase-hub" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push (by its digest, no tag yet)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/docker
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.img.outputs.img }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest for docker-tags
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "no digest from the build"; exit 1;; esac
          mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-tags:
    # Joins the amd64 and arm64 images into one name (Docker picks the right one by itself) and tags it X.Y.Z, X.Y and latest.
    name: publish the Docker image
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write      # tag the image in GitHub's registry
      id-token: write      # for the signed build note (attestation) of the image
      attestations: write  # store that note with the image
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag both images as one
        id: tag
        run: |
          V=${GITHUB_REF_NAME#v}; IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homebase-hub"
          cd /tmp/digests
          n=$(find . -maxdepth 1 -type f -regextype posix-extended -regex './[0-9a-f]{64}' | wc -l)
          [ "$n" = 2 ] || { echo "expected 2 digests, found $n"; ls -la; exit 1; }
          refs=(); for d in *; do refs+=("$IMG@sha256:$d"); done
          docker buildx imagetools create -t "$IMG:$V" -t "$IMG:${V%.*}" -t "$IMG:latest" "${refs[@]}"
          docker buildx imagetools inspect "$IMG:$V"
          D=$(docker buildx imagetools inspect "$IMG:$V" --format '{{json .Manifest}}' | jq -r .digest)
          case "$D" in sha256:*) ;; *) echo "no digest for $IMG:$V"; exit 1;; esac
          { echo "img=$IMG"; echo "digest=$D"; } >> "$GITHUB_OUTPUT"
      - name: Signed build note for the image (a failure here never stops it)
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tag.outputs.img }}
          subject-digest: ${{ steps.tag.outputs.digest }}
          push-to-registry: true
