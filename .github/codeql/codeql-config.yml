# What CodeQL reads: the site's own scripts, the Tools source, the Python build scripts and tests, and the workflow files (.github). The built bundles in src/web/tools/assets are generated from tools-app
# (and checked against a fresh build in CI), and third-party libraries are checked by tests/repo/check_libraries.py, so they are left out. The Animated Designs (React Bits components and the ogl, three and vgpu libraries, built into src/web/home/designs) are third-party
# drawing code: tests/repo/designs_test.py checks that they never fetch, run text as code or use a web address. CodeQL's "insecure randomness" and "string escaping" findings there
# (Math.random for a visual effect) are not security problems, so they are left out too.
name: Homebase Hub
paths:
  - src
  - tools-app/src
  - scripts
  - tests
  - .github
paths-ignore:
  - src/web/tools/assets
  - src/web/hub/core/assets/vendor
  - '**/node_modules'
  - src/web/home/designs
  - src/web/home/designs-src
