# GitHub proposes a pull request when an Action, a build tool (esbuild, axe-core, eslint), a Python test package or a Docker image (deploy/docker) has a new version.
# Read it, check that CI passes, and merge. Nothing here changes the site itself.
# Once a month (2026-11; was weekly), one grouped pull request per kind. A version is proposed only once it is 7 days old (cooldown):
# a hijacked package is usually found and pulled within days. Security updates are not held back by either.
# Tools' libraries: the monthly maintenance already takes minor and patch versions; Dependabot only proposes a new major version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    ignore:
      # TypeScript 7 (the rewrite) finds 48 new errors in files.js and links-import.js (2026-11): moving to it is its own planned change
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      build-tools:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "test"
    groups:
      test-tools:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tools-app
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "tools"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]   # the monthly maintenance does these
    groups:
      tools-libraries:
        patterns: ["*"]
  # (1.73.0) The Docker image's PHP base and the Caddy image in compose.caddy.yaml, both pinned by digest. CI builds the image
  # and runs tests/server/docker_test.py (with Caddy) on the pull request; the next release publishes it.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docker"
    groups:
      docker-images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /deploy/docker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docker"
    groups:
      compose-images:
        patterns: ["*"]
