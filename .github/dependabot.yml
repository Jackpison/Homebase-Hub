# GitHub proposes a pull request when an Action, a build tool (esbuild, axe-core, eslint) or a Python test package has a new version.
# Read it, check that CI passes, and merge. Nothing here changes the site itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      build-tools:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    commit-message:
      prefix: "test"
    groups:
      test-tools:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tools-app
    schedule:
      interval: weekly
    commit-message:
      prefix: "tools"
    groups:
      tools-libraries:
        patterns: ["*"]
