# GitHub proposes a pull request when an Action used by the workflows has a new version.
# Read it, check that CI passes, and merge. Nothing here changes the site itself.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
